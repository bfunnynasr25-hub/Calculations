<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bar Chart Maker</title>
  <style>
    :root { --ink:#17211d; --muted:#64716a; --paper:#f7f6f1; --card:#fffefa; --line:#e3e5dc; --green:#197653; --soft:#e1f2e7; --red:#a94239; }
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Inter,system-ui,-apple-system,Segoe UI,sans-serif} main{max-width:1050px;margin:auto;padding:42px 22px 56px} h1{font:700 clamp(2rem,5vw,3.3rem)/1 Georgia,serif;letter-spacing:-.045em;margin:0} .lead{margin:.55rem 0 30px;color:var(--muted)} .layout{display:grid;grid-template-columns:350px 1fr;gap:22px;align-items:start}.panel,.chart-panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(26,35,28,.035)}h2{font-size:1.05rem;margin:0 0 16px}.form-row{display:grid;grid-template-columns:1fr 105px;gap:10px}label{display:grid;gap:6px;font-size:.81rem;font-weight:750;color:var(--muted)}input,button{font:inherit}input{width:100%;border:1px solid #d5d9cf;background:#fff;border-radius:10px;padding:11px;outline-color:var(--green);color:var(--ink)}button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:800}.primary{width:100%;background:var(--green);color:#fff;margin-top:12px}.primary:hover{background:#126344}.sample{display:block;background:transparent;color:var(--green);padding:10px 0 0;font-size:.87rem}.entries{list-style:none;margin:20px 0 0;padding:0;border-top:1px solid var(--line)}.entries li{display:grid;grid-template-columns:1fr auto 26px;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.entry-name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.entry-value{font-variant-numeric:tabular-nums;font-weight:800}.remove{background:transparent;color:#9ca59e;padding:2px;font-size:1.25rem}.remove:hover{color:var(--red)}.empty{color:var(--muted);font-size:.9rem;padding:16px 0}.chart-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:5px}.total{font-size:.83rem;color:var(--muted);font-weight:750}.chart-wrap{height:390px;min-width:0;padding-top:6px}.chart-wrap svg{width:100%;height:100%;overflow:visible}.axis{stroke:#cfd5ce;stroke-width:1}.gridline{stroke:#e8ebe5;stroke-width:1}.tick{fill:var(--muted);font-size:11px}.bar{fill:var(--green);transition:height .32s ease,y .32s ease}.bar:hover{fill:#105f40}.bar-label{fill:var(--ink);font-size:12px;font-weight:700}.value-label{fill:var(--ink);font-size:12px;font-weight:750}.note{margin:16px 0 0;color:var(--muted);font-size:.82rem}@media(max-width:760px){main{padding:28px 16px}.layout{grid-template-columns:1fr}.chart-wrap{height:330px}.panel,.chart-panel{padding:18px}}
  </style>
</head>
<body>
  <main>
    <h1>Bar Chart Maker</h1>
    <p class="lead">Add your own numbers and see the comparison instantly.</p>
    <section class="layout">
      <aside class="panel">
        <h2>Add a value</h2>
        <form id="entryForm">
          <div class="form-row">
            <label>Label<input id="labelInput" maxlength="22" required placeholder="e.g. January"></label>
            <label>Number<input id="valueInput" min="0" step="any" inputmode="decimal" required type="number" placeholder="0"></label>
          </div>
          <button class="primary" type="submit">Add to chart</button>
        </form>
        <button class="sample" id="sampleBtn" type="button">Load sample data</button>
        <ul class="entries" id="entries"></ul>
        <div class="empty" id="empty">Add numbers to start your chart.</div>
      </aside>
      <section class="chart-panel">
        <div class="chart-top"><h2>Your bar chart</h2><span class="total" id="summary">0 values</span></div>
        <div class="chart-wrap" id="chartWrap">
          <svg id="chart" role="img" aria-labelledby="chartTitle chartDescription">
            <title id="chartTitle">Your data bar chart</title>
            <desc id="chartDescription">No data has been entered.</desc>
          </svg>
        </div>
        <p class="note">Hover over a bar to highlight it. Values update as you add or remove entries.</p>
      </section>
    </section>
  </main>
  <script>
    const form = document.getElementById('entryForm'), labelInput = document.getElementById('labelInput'), valueInput = document.getElementById('valueInput');
    const entriesEl = document.getElementById('entries'), emptyEl = document.getElementById('empty'), chart = document.getElementById('chart'), wrap = document.getElementById('chartWrap'), summary = document.getElementById('summary'), description = document.getElementById('chartDescription');
    let values = [];
    const format = n => new Intl.NumberFormat(undefined,{maximumFractionDigits:2}).format(n);
    form.addEventListener('submit', event => { event.preventDefault(); values.push({label:labelInput.value.trim(), value:Number(valueInput.value)}); form.reset(); labelInput.focus(); render(); });
    document.getElementById('sampleBtn').addEventListener('click', () => { values = [{label:'January',value:42},{label:'February',value:68},{label:'March',value:31},{label:'April',value:85}]; render(); });
    function remove(index){ values.splice(index,1); render(); }
    function make(tag, attrs={}, text=''){ const item=document.createElementNS('http://www.w3.org/2000/svg',tag); Object.entries(attrs).forEach(([key,value])=>item.setAttribute(key,value)); item.textContent=text; return item; }
    function renderList(){ entriesEl.replaceChildren(); emptyEl.hidden=values.length>0; values.forEach((item,index)=>{ const li=document.createElement('li'), name=document.createElement('span'), amount=document.createElement('span'), button=document.createElement('button'); name.className='entry-name';name.textContent=item.label;amount.className='entry-value';amount.textContent=format(item.value);button.className='remove';button.type='button';button.ariaLabel=`Remove ${item.label}`;button.textContent='x';button.addEventListener('click',()=>remove(index));li.append(name,amount,button);entriesEl.append(li); }); }
    function renderChart(){ const width=Math.max(300,wrap.clientWidth), height=360, left=48, right=18, top=28, bottom=62, plotWidth=width-left-right, plotHeight=height-top-bottom; chart.setAttribute('viewBox',`0 0 ${width} ${height}`); chart.replaceChildren(make('title',{},'Your data bar chart'),description); if(!values.length){ description.textContent='No data has been entered.'; chart.append(make('text',{x:width/2,y:height/2,'text-anchor':'middle',class:'tick'},'Your bars will appear here')); return; } const max=Math.max(...values.map(d=>d.value),1), niceMax=Math.ceil(max/5)*5 || 5; description.textContent=values.map(d=>`${d.label}: ${format(d.value)}`).join(', '); for(let i=0;i<=5;i++){ const value=niceMax*i/5, y=top+plotHeight-(value/niceMax*plotHeight); chart.append(make('line',{x1:left,y1:y,x2:width-right,y2:y,class:'gridline'})); chart.append(make('text',{x:left-8,y:y+4,'text-anchor':'end',class:'tick'},format(value))); } chart.append(make('line',{x1:left,y1:top,x2:left,y2:top+plotHeight,class:'axis'})); chart.append(make('line',{x1:left,y1:top+plotHeight,x2:width-right,y2:top+plotHeight,class:'axis'})); const step=plotWidth/values.length, barWidth=Math.min(70,step*.66); values.forEach((item,index)=>{ const barHeight=item.value/niceMax*plotHeight, x=left+step*index+(step-barWidth)/2, y=top+plotHeight-barHeight; const rect=make('rect',{x,y,width:barWidth,height:barHeight,rx:5,class:'bar',tabindex:'0'}); rect.setAttribute('aria-label',`${item.label}: ${format(item.value)}`); chart.append(rect); chart.append(make('text',{x:x+barWidth/2,y:Math.max(17,y-7),'text-anchor':'middle',class:'value-label'},format(item.value))); const label=item.label.length>11?item.label.slice(0,10)+'...':item.label; chart.append(make('text',{x:x+barWidth/2,y:top+plotHeight+20,'text-anchor':'middle',class:'bar-label'},label)); }); }
    function render(){ renderList(); renderChart(); summary.textContent=`${values.length} ${values.length===1?'value':'values'}`; }
    new ResizeObserver(renderChart).observe(wrap); render();
  </script>
</body>
</html>
