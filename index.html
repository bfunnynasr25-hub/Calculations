<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily Spend</title>
  <style>
    :root { --ink:#18211d; --muted:#69756e; --paper:#f7f6f1; --card:#fffefa; --line:#e5e5dc; --accent:#207a55; --accent-soft:#e2f3e8; --danger:#b1463e; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    main { max-width:1060px; margin:auto; padding:42px 22px 60px; }
    header { display:flex; justify-content:space-between; align-items:flex-start; gap:20px; margin-bottom:30px; } h1 { margin:0; font:700 clamp(2rem,5vw,3.3rem)/1 Georgia, serif; letter-spacing:-.04em; } .sub { color:var(--muted); margin:.4rem 0 0; }
    .date { color:var(--accent); font-weight:700; background:var(--accent-soft); border-radius:999px; padding:8px 13px; white-space:nowrap; }
    .grid { display:grid; grid-template-columns:1.05fr .95fr; gap:22px; } .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:24px; box-shadow:0 8px 24px rgba(26,35,28,.035); } h2 { font-size:1.05rem; margin:0 0 18px; }
    .total { background:var(--ink); color:white; border:0; } .total h2 { color:#d8e5dc; } .amount { font:700 3.2rem/1 Georgia,serif; letter-spacing:-.04em; } .budgetline { margin-top:17px; color:#cbd8cf; font-size:.92rem; } progress { appearance:none; display:block; width:100%; height:8px; margin:9px 0 0; } progress::-webkit-progress-bar { background:#425049; border-radius:10px; } progress::-webkit-progress-value { background:#81d5a5; border-radius:10px; }
    form { display:grid; gap:13px; } .formrow { display:grid; grid-template-columns:1fr 130px 110px; gap:12px; } label { font-size:.82rem; font-weight:700; color:var(--muted); display:grid; gap:6px; } input, select, button { font:inherit; } input, select { width:100%; border:1px solid #d7d9d0; border-radius:10px; background:#fff; padding:11px 12px; color:var(--ink); outline-color:var(--accent); } button { cursor:pointer; border:0; border-radius:10px; padding:12px 16px; font-weight:800; } .add { background:var(--accent); color:white; } .add:hover { background:#176443; }
    .history { margin-top:22px; } .history-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; } .clear { padding:5px 0; color:var(--danger); background:transparent; font-size:.83rem; } .empty { color:var(--muted); padding:18px 0 4px; text-align:center; } ul { list-style:none; padding:0; margin:0; } li { display:grid; grid-template-columns:42px 1fr auto 30px; align-items:center; gap:10px; padding:12px 0; border-top:1px solid var(--line); } .icon { background:var(--accent-soft); color:var(--accent); width:38px; height:38px; border-radius:10px; display:grid; place-items:center; font-size:1.05rem; } .item-name { font-weight:700; } .item-meta { color:var(--muted); font-size:.78rem; } .item-amount { font-weight:800; } .delete { color:#9da59f; background:transparent; padding:4px; font-size:1.25rem; } .delete:hover { color:var(--danger); }
    .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:22px; } .stat { background:#eef1ea; border-radius:12px; padding:14px; } .stat span { display:block; color:var(--muted); font-size:.75rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em; } .stat strong { display:block; margin-top:4px; font-size:1.15rem; }
    @media (max-width:720px) { main { padding:27px 16px; } header { margin-bottom:21px; } .grid { grid-template-columns:1fr; } .card { padding:19px; } .formrow { grid-template-columns:1fr 1fr; } .formrow label:last-child { grid-column:1 / -1; } .summary { grid-template-columns:1fr; } .amount { font-size:2.7rem; } }
  </style>
</head>
<body>
  <main>
    <header><div><h1>Daily Spend</h1><p class="sub">A calm place to keep an eye on your money.</p></div><div class="date" id="dateLabel"></div></header>
    <section class="grid">
      <div class="card total"><h2>Spent today</h2><div class="amount" id="todayTotal">EGP 0.00</div><div class="budgetline"><span id="budgetText">Set a daily budget below</span><progress id="budgetProgress" value="0" max="100"></progress></div></div>
      <div class="card"><h2>Add an expense</h2><form id="expenseForm"><label>What did you buy?<input id="description" required maxlength="60" placeholder="e.g. Morning coffee" /></label><div class="formrow"><label>Amount<input id="amount" required min="0.01" step="0.01" type="number" inputmode="decimal" placeholder="0.00" /></label><label>Category<select id="category"><option>Food</option><option>Transport</option><option>Shopping</option><option>Bills</option><option>Health</option><option>Fun</option><option>Other</option></select></label><label>Paid with<select id="payment"><option>Cash</option><option>Visa</option></select></label></div><button class="add" type="submit">Add expense</button></form></div>
    </section>
    <section class="card history"><div class="history-head"><h2>Today's expenses</h2><button class="clear" id="clearBtn" type="button">Clear today</button></div><ul id="expenseList"></ul><div id="emptyState" class="empty">No expenses yet. Your first entry will appear here.</div></section>
    <section class="summary"><div class="stat"><span>Entries today</span><strong id="entryCount">0</strong></div><div class="stat"><span>Largest expense</span><strong id="largest">—</strong></div><div class="stat"><span>Daily budget</span><strong><input id="budget" type="number" min="0" step="1" placeholder="Set budget" aria-label="Daily budget" style="border:0;background:transparent;padding:0;width:110px;font-weight:800;font-size:1.05rem" /></strong></div></section>
  </main>
  <script>
    const storageKey = 'daily-spend-expenses-v1', budgetKey = 'daily-spend-budget-v1';
    let expenses = JSON.parse(localStorage.getItem(storageKey) || '[]');
    const icons = {Food:'☕', Transport:'◉', Shopping:'□', Bills:'⌁', Health:'✚', Fun:'★', Other:'•'};
    const today = () => new Date().toISOString().slice(0,10);
    const money = n => new Intl.NumberFormat('en-EG',{style:'currency',currency:'EGP',maximumFractionDigits:2}).format(n);
    document.getElementById('dateLabel').textContent = new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric'}).format(new Date());
    const budgetInput = document.getElementById('budget'); budgetInput.value = localStorage.getItem(budgetKey) || '';
    budgetInput.addEventListener('input', () => { localStorage.setItem(budgetKey,budgetInput.value); render(); });
    document.getElementById('expenseForm').addEventListener('submit', e => { e.preventDefault(); expenses.unshift({id:crypto.randomUUID(), date:today(), description:description.value.trim(), amount:Number(amount.value), category:category.value, payment:payment.value}); localStorage.setItem(storageKey,JSON.stringify(expenses)); e.target.reset(); description.focus(); render(); });
    document.getElementById('clearBtn').addEventListener('click', () => { if(confirm('Remove all expenses from today?')) { expenses = expenses.filter(x=>x.date!==today()); localStorage.setItem(storageKey,JSON.stringify(expenses)); render(); } });
    function render(){ const list=document.getElementById('expenseList'), current=expenses.filter(x=>x.date===today()), total=current.reduce((s,x)=>s+x.amount,0), budget=Number(budgetInput.value); document.getElementById('todayTotal').textContent=money(total); document.getElementById('entryCount').textContent=current.length; document.getElementById('largest').textContent=current.length?money(Math.max(...current.map(x=>x.amount))):'—'; document.getElementById('emptyState').hidden=!!current.length; document.getElementById('budgetText').textContent=budget?`${money(Math.max(0,budget-total))} remaining of ${money(budget)}`:'Set a daily budget below'; const p=document.getElementById('budgetProgress'); p.value=budget?Math.min(100,total/budget*100):0; list.innerHTML=current.map(x=>`<li><span class="icon">${icons[x.category]}</span><div><div class="item-name">${escapeHTML(x.description)}</div><div class="item-meta">${x.category} · ${x.payment || 'Cash'}</div></div><span class="item-amount">${money(x.amount)}</span><button class="delete" title="Delete ${escapeHTML(x.description)}" onclick="removeExpense('${x.id}')">×</button></li>`).join(''); }
    function escapeHTML(value){ return value.replace(/[&<>'"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function removeExpense(id){ expenses=expenses.filter(x=>x.id!==id); localStorage.setItem(storageKey,JSON.stringify(expenses)); render(); } window.removeExpense=removeExpense; render();
  </script>
</body>
</html>
